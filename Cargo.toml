[package]
name = "tinyviolin"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Small real-time-safe synthesized instruments"
license = "MIT"
repository = "https://github.com/SanderVocke/tinyviolin"
documentation = "https://docs.rs/tinyviolin"
readme = "README.md"
keywords = ["audio", "synthesizer", "midi", "dsp"]
categories = ["multimedia::audio"]
exclude = ["/.github", "/.gitignore", "/bundler.toml"]

[workspace]
members = [".", "showcase"]
default-members = ["."]
resolver = "3"

[dependencies]

[lints.rust]
# The library independently forbids unsafe code. Integration instrumentation may use it.
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
